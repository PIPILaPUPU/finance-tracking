services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finance_tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/finance_tracker?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  auth:
    build:
      context: .
      target: auth
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/finance_tracker?sslmode=disable
      SERVER_PORT: "8080"
      JWT_SECRET: OiJG9pVB9hdNBM7Yp0rxyhQCsHstedWx
      JWT_ISSUER: auth-app
    depends_on:
      migrate:
        condition: service_completed_successfully

  account:
    build:
      context: .
      target: account
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/finance_tracker?sslmode=disable
      SERVER_PORT: "8081"
      JWT_SECRET: OiJG9pVB9hdNBM7Yp0rxyhQCsHstedWx
      JWT_ISSUER: auth-app
    depends_on:
      migrate:
        condition: service_completed_successfully

  category:
    build:
      context: .
      target: category
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/finance_tracker?sslmode=disable
      SERVER_PORT: "8083"
      JWT_SECRET: OiJG9pVB9hdNBM7Yp0rxyhQCsHstedWx
      JWT_ISSUER: auth-app
    depends_on:
      migrate:
        condition: service_completed_successfully

  transaction:
    build:
      context: .
      target: transaction
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/finance_tracker?sslmode=disable
      SERVER_PORT: "8082"
      JWT_SECRET: OiJG9pVB9hdNBM7Yp0rxyhQCsHstedWx
      JWT_ISSUER: auth-app
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-80}:80"
    depends_on:
      - auth
      - account
      - category
      - transaction

volumes:
  postgres_data:
